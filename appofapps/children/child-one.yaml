apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: child-one, namespace: argocd}
spec:
  project: default
  source: {repoURL: https://github.com/hisco/argotests, targetRevision: HEAD, path: kustomize/plain}
  destination: {server: https://kubernetes.default.svc, namespace: probe-child-one}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
