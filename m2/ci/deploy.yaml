apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: ci-web}
  template:
    metadata:
      labels: {app: ci-web}
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command: ["./podinfo", "--stress-memory=100"]
          resources:
            requests: {memory: 16Mi}
            limits: {memory: 64Mi}
