apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: chart-web}
  template:
    metadata:
      labels: {app: chart-web}
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command: ["./podinfo", "--stress-memory=200"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
