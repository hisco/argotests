apiVersion: batch/v1
kind: CronJob
metadata:
  name: ff-kinds-report
spec:
  schedule: "*/30 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: report
            image: busybox:1.36
            command:
            - sh
            - -c
            - echo report
