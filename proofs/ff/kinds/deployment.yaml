apiVersion: apps/v1
kind: Deployment
metadata:
  name: ff-kinds
spec:
  selector:
    matchLabels:
      app: ff-kinds
  template:
    metadata:
      labels:
        app: ff-kinds
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        ports:
        - containerPort: 9898
        resources:
          requests:
            cpu: 50m
            memory: 16Mi
          limits:
            memory: 64Mi
