apiVersion: apps/v1
kind: Deployment
metadata:
  name: ff-overlay
  annotations:
    team.example.com/owner: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ff-overlay
  template:
    metadata:
      labels:
        app: ff-overlay
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        args:
        - --port=9898
        - --level=info
        env:
        - name: PODINFO_UI_MESSAGE
          value: hello from base
        - name: GREETING_MODE
          value: blue
        ports:
        - name: http
          containerPort: 9898
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9898
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 16Mi
          limits:
            memory: 64Mi
