apiVersion: apps/v1
kind: Deployment
metadata:
  name: ff-plain
  labels:
    app: ff-plain
    tier: web
  annotations:
    team.example.com/owner: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ff-plain
  template:
    metadata:
      labels:
        app: ff-plain
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        args:
        - --port=9898
        - --level=info
        env:
        - name: PODINFO_UI_MESSAGE
          value: hello from radar
        - name: GREETING_MODE
          value: blue
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: http
          containerPort: 9898
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9898
          periodSeconds: 10
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9898
          periodSeconds: 15
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
