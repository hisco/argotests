apiVersion: apps/v1
kind: Deployment
metadata:
  name: nh-nolimit
spec:
  replicas: 1
  selector:
    matchLabels: {app: nh-nolimit}
  template:
    metadata:
      labels: {app: nh-nolimit}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          env:
            - name: PODINFO_UI_MESSAGE
              value: hello
