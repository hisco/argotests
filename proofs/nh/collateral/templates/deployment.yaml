apiVersion: apps/v1
kind: Deployment
metadata:
  name: nh-collateral
  labels:
    app.kubernetes.io/version: {{ .Values.tag | quote }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nh-collateral}
  template:
    metadata:
      labels:
        app: nh-collateral
        app.kubernetes.io/version: {{ .Values.tag | quote }}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:{{ .Values.tag }}
          resources:
            limits:
              memory: 64Mi
