apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-base-overlay
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests
    targetRevision: HEAD
    path: kustomize/base-overlay/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: probe-kbase
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
