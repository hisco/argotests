apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-single-overlay
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests
    targetRevision: HEAD
    path: helm/single-overlay/prod
    helm:
      releaseName: single
      valueFiles:
        - ../values.yaml
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: probe-single
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
