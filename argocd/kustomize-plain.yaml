apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-plain
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests
    targetRevision: HEAD
    path: kustomize/plain
  destination:
    server: https://kubernetes.default.svc
    namespace: probe-kplain
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
