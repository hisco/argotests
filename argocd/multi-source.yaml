apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: multi-source, namespace: argocd}
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: common
      targetRevision: 2.31.3
    - repoURL: https://github.com/hisco/argotests
      targetRevision: HEAD
      path: kustomize/plain
  destination: {server: https://kubernetes.default.svc, namespace: probe-multisource}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
