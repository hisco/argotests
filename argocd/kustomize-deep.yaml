apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: kustomize-deep, namespace: argocd}
spec:
  project: default
  source: {repoURL: https://github.com/hisco/argotests, targetRevision: HEAD, path: kustomize/deep/overlay}
  destination: {server: https://kubernetes.default.svc, namespace: probe-kdeep}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
