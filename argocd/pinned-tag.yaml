apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: pinned-tag, namespace: argocd}
spec:
  project: default
  source: {repoURL: https://github.com/hisco/argotests, targetRevision: v1, path: kustomize/plain}
  destination: {server: https://kubernetes.default.svc, namespace: probe-pinned}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
