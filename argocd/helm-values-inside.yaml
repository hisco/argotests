apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-values-inside
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests
    targetRevision: HEAD
    path: helm/values-inside/app
    helm:
      releaseName: inside
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: probe-inside
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
