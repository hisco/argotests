apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-plain
  namespace: fx-plain
  annotations:
    team.example.com/owner: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-plain
  template:
    metadata:
      labels:
        app: fx-plain
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        ports:
        - name: http
          containerPort: 9898
        env:
        - name: PODINFO_UI_MESSAGE
          value: hello from flux
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
