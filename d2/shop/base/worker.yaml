# A queue worker. Git leaves its replica count to whoever runs it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo ready; sleep 86400"]
          resources:
            requests:
              memory: 8Mi
            limits:
              memory: 32Mi
  replicas: 2
