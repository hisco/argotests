# The storefront web tier: two replicas by default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: web
          image: nginx:1.25.3-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
