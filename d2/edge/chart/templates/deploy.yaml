apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
      annotations:
        greeting: {{ .Values.greeting | quote }}
    spec:
      containers:
        - name: proxy
          image: nginx:1.25
          ports:
            - containerPort: 80
