apiVersion: apps/v1
kind: Deployment
metadata:
  name: sc-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sc-kustomize
  template:
    metadata:
      labels:
        app: sc-kustomize
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        ports:
        - name: http
          containerPort: 9898
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
