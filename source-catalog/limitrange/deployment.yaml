apiVersion: apps/v1
kind: Deployment
metadata:
  name: sc-limitrange
  namespace: sc-limitrange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sc-limitrange
  template:
    metadata:
      labels:
        app: sc-limitrange
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
