apiVersion: apps/v1
kind: Deployment
metadata:
  name: options
  namespace: checkout
  labels:
    app.kubernetes.io/name: options
    app.kubernetes.io/part-of: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: options
  template:
    metadata:
      labels:
        app.kubernetes.io/name: options
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        ports:
        - containerPort: 9898
          name: http
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
