apiVersion: apps/v1
kind: Deployment
metadata:
  name: inline-merge
  namespace: cat-44
  labels:
    app.kubernetes.io/name: inline-merge
    app.kubernetes.io/part-of: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inline-merge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inline-merge
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        ports:
        - containerPort: 9898
          name: http
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 32Mi
