apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-tree
  namespace: cat-10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-tree
  template:
    metadata:
      labels:
        app: app-tree
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        ports:
        - name: http
          containerPort: 9898
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
