id: 19-commit-pin
title: Exact commit pin
pattern: An Application deploys an exact Git commit.
dimensions:
- revision
sources:
- https://argo-cd.readthedocs.io/en/stable/user-guide/tracking_strategies/
- https://argo-cd.readthedocs.io/en/stable/operator-manual/cluster-bootstrapping/
prevalence:
  level: common
  evidence: Argo CD describes commit pinning for production and bootstrapping. These labels are qualitative,
    not measured adoption shares.
memory_set_by:
  method: literal manifest scalar
  file: catalog/19-commit-pin/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
  value: 64Mi
support: none
support_why: "The Application deploys a fixed commit. A PR wouldn't change what's deployed."
expected: not-supported
notes:
- Predicted for a live synced Deployment, a connected GitHub account with write access, readable repository,
  and no external controller changing memory. The requested edit is 64Mi to 128Mi.
- The Application pins the commit that added this catalog.
- No commit, tag, or branch is created here. The configured existing ref resolves, so Radar can return
  pinned-revision before reading the source path. Argo CD cannot deploy this new catalog path from the
  old ref. Local YAML verification does not prove remote Argo CD deployment.
render_check:
  command: cat catalog/19-commit-pin/apps/checkout/deployment.yaml
  result: passed
  assertions:
  - Exactly one Deployment commit-pin in cat-19
  - replicas=1
  - image=ghcr.io/stefanprodan/podinfo:6.7.1
  - requests.memory=16Mi
  - limits.memory=64Mi
  scope: Local workload rendering and YAML parsing. No remote ref or live Argo CD sync was verified.
expected_reason:
  code: pinned-revision
  message: cat-19-commit-pin deploys Git version b72b44898fae1cfbed33aadbad4d3d0005fab2cb. A pull request
    reaches it only when cat-19-commit-pin moves to a newer Git version.
