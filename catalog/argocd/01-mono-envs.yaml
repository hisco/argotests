apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-01-mono-envs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/01-mono-envs/envs/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-01
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
