apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-kustomize
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/59-custom-kustomize/apps/checkout
    kustomize:
      version: v5.8.1
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-59
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
