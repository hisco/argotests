apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: values-object
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/31-values-object/apps/checkout
    helm:
      valuesObject:
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-31
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
