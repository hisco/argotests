apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-61-git-range
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: 1.*
    path: catalog/61-git-range/apps/checkout
    tagPrefix: checkout/
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-61
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
