apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-08-yaml-anchor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/08-yaml-anchor/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-08
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
