apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: label-patch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/46-label-patch/apps/checkout/envs/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-46
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
