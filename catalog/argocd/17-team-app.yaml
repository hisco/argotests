apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-17-team-app
  namespace: checkout-team
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/17-team-app/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-17
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
