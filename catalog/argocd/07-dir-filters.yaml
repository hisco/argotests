apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-07-dir-filters
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/07-dir-filters/envs/prod
    directory:
      recurse: true
      include: '{manifests/*.yaml,operations/*.yaml}'
      exclude: operations/*
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-07
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
