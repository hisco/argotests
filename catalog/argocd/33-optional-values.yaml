apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: optional-values
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/33-optional-values/apps/checkout
    helm:
      valueFiles:
      - ../../envs/prod/values.yaml
      - ../../clusters/eu-west/values.yaml
      ignoreMissingValueFiles: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-33
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
