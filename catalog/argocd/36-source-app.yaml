apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: source-app
  namespace: team-checkout
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/36-source-app/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-36
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
