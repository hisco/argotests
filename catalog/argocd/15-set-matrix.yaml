apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cat-15-set-matrix
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/hisco/argotests.git
          revision: main
          directories:
          - path: catalog/15-set-matrix/envs/*/apps/*
      - list:
          elements:
          - environment: prod
            namespace: cat-15
  template:
    metadata:
      name: cat-15-set-matrix
    spec:
      project: default
      source:
        repoURL: https://github.com/hisco/argotests.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
