apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-02-app-repo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/02-app-repo/deploy/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-02
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
