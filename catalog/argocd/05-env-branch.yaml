apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-05-env-branch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: production
    path: catalog/05-env-branch/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-05
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
