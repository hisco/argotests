apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-06-dir-recurse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/06-dir-recurse/envs/prod
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-06
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
