apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cat-63-pr-preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - pullRequest:
      github:
        owner: hisco
        repo: argotests
        labels:
        - preview
      requeueAfterSeconds: 1800
  template:
    metadata:
      name: cat-63-preview-{{.number}}
    spec:
      project: default
      source:
        repoURL: https://github.com/hisco/argotests.git
        targetRevision: '{{.head_sha}}'
        path: catalog/63-pr-preview/apps/checkout
      destination:
        server: https://kubernetes.default.svc
        namespace: cat-63
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
