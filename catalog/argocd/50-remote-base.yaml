apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: remote-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/50-remote-base/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-50
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
