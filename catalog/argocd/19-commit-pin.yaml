apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-19-commit-pin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: b72b44898fae1cfbed33aadbad4d3d0005fab2cb
    path: catalog/19-commit-pin/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-19
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
