apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-04-config-repo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/04-config-repo/clusters/production/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-04
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
