apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: generated-memory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/49-generated-memory/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-49
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
