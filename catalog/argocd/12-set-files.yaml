apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cat-12-set-files
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - git:
      repoURL: https://github.com/hisco/argotests.git
      revision: main
      files:
      - path: catalog/12-set-files/environments/*/config.yaml
  template:
    metadata:
      name: cat-12-set-files
    spec:
      project: default
      source:
        repoURL: https://github.com/hisco/argotests.git
        targetRevision: main
        path: '{{.appPath}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
