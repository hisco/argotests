apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-parameter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/32-helm-parameter/apps/checkout
    helm:
      parameters:
      - name: resources.limits.memory
        value: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-32
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
