apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-18-release-tag
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: v2
    path: catalog/18-release-tag/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-18
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
