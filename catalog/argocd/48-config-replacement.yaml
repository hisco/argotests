apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-replacement
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/48-config-replacement/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-48
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
