apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resources-tpl
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/28-resources-tpl/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-28
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
