apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-09-multi-doc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/09-multi-doc/apps/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-09
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
