apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: template-literal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/66-template-literal/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-66
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
