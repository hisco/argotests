apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chart-values-ref
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-38
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.7.1
    helm:
      valueFiles:
      - $values/catalog/38-chart-values-ref/envs/prod/values.yaml
  - repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    ref: values
