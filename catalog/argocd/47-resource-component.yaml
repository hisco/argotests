apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resource-component
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/47-resource-component/apps/checkout/envs/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-47
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
