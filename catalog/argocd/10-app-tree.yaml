apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-10-app-tree-parent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/10-app-tree/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
