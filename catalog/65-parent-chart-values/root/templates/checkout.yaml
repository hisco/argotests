apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parent-chart-values
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.7.1
    helm:
      valuesObject:
        fullnameOverride: parent-chart-values
        replicaCount: 1
        resources: {{- toYaml .Values.resources | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cat-65
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
