apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- resources.yaml
replacements:
- source:
    kind: ConfigMap
    name: checkout-resources
    fieldPath: data.memory
  targets:
  - select:
      kind: Deployment
      name: config-replacement
    fieldPaths:
    - spec.template.spec.containers.[name=podinfo].resources.limits.memory
