# Derived sample output of this ApplicationSet. Do not install separately.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cat-15-set-matrix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: catalog/15-set-matrix/envs/prod/apps/checkout
  destination:
    server: https://kubernetes.default.svc
