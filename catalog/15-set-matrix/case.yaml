id: 15-set-matrix
title: ApplicationSet app and environment matrix
pattern: An ApplicationSet combines app discovery with an environment list.
dimensions:
- application-creation
- environment
sources:
- https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-Matrix/
- https://github.com/argoproj/argocd-example-apps
prevalence:
  level: common
  evidence: Official Matrix generator combines two parameter sets; example apps include it. These labels
    are qualitative, not measured adoption shares.
memory_set_by:
  method: literal manifest scalar
  file: catalog/15-set-matrix/envs/prod/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
  value: 64Mi
support: full
support_why: "Edits the source of the matrix member that deploys this workload."
expected: supported
notes:
- Predicted for a live synced Deployment, a connected GitHub account with write access, readable repository,
  and no external controller changing memory. The requested edit is 64Mi to 128Mi.
- generated-application.yaml is derived sample output for inspection, not another Application to install.
  The render check validates its workload source; no ApplicationSet controller was run.
render_check:
  command: cat catalog/15-set-matrix/envs/prod/apps/checkout/deployment.yaml
  result: passed
  assertions:
  - Exactly one Deployment set-matrix in cat-15
  - replicas=1
  - image=ghcr.io/stefanprodan/podinfo:6.7.1
  - requests.memory=16Mi
  - limits.memory=64Mi
  scope: Local workload rendering and YAML parsing. No remote ref or live Argo CD sync was verified.
expected_edit:
  file: catalog/15-set-matrix/envs/prod/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
