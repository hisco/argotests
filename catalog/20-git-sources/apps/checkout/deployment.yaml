apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-sources
  namespace: cat-20
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-sources
  template:
    metadata:
      labels:
        app: git-sources
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        ports:
        - name: http
          containerPort: 9898
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
