id: 17-team-app
title: Application in a team namespace
pattern: An Application lives in a team namespace outside the Argo CD control plane.
dimensions:
- application-creation
sources:
- https://argo-cd.readthedocs.io/en/stable/operator-manual/app-any-namespace/
prevalence:
  level: occasional
  evidence: Argo CD documents this opt-in tenancy model and its project prerequisites. These labels are
    qualitative, not measured adoption shares.
memory_set_by:
  method: literal manifest scalar
  file: catalog/17-team-app/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
  value: 64Mi
expected: supported
notes:
- Predicted for a live synced Deployment, a connected GitHub account with write access, readable repository,
  and no external controller changing memory. The requested edit is 64Mi to 128Mi.
- 'Setup prerequisite: allow checkout-team in Argo CD application namespaces and in the default AppProject
  sourceNamespaces; create that namespace first. This follows the required default project for this catalog,
  although Argo CD recommends a restricted project for real tenant namespaces.'
render_check:
  command: cat catalog/17-team-app/apps/checkout/deployment.yaml
  result: passed
  assertions:
  - Exactly one Deployment team-app in cat-17
  - replicas=1
  - image=ghcr.io/stefanprodan/podinfo:6.7.1
  - requests.memory=16Mi
  - limits.memory=64Mi
  scope: Local workload rendering and YAML parsing. No remote ref or live Argo CD sync was verified.
expected_edit:
  file: catalog/17-team-app/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
