apiVersion: apps/v1
kind: Deployment
metadata:
  name: template-literal
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: template-literal
  template:
    metadata:
      labels:
        app: template-literal
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
