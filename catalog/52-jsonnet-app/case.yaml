id: 52-jsonnet-app
title: Jsonnet source
pattern: A Jsonnet program generates the Kubernetes Deployment.
dimensions:
- source-type
- memory-location
sources:
- https://argo-cd.readthedocs.io/en/stable/user-guide/jsonnet/
- https://github.com/argoproj/argocd-example-apps/tree/master/jsonnet-guestbook
prevalence:
  level: occasional
  evidence: This is a documented upstream feature with worked examples. No adoption
    percentage is claimed.
memory_set_by: Application spec.source.directory.jsonnet.extVars[name=memory].value;
  deployment.jsonnet reads std.extVar("memory").
support: none
support_why: "Jsonnet code builds the Deployment. Radar doesn't edit Jsonnet."
expected: not-supported
notes:
- Validated with go-jsonnet 0.21.0. Install its jsonnet executable on PATH before
  repeating the render_check command.
render_check:
  command: jsonnet --ext-str memory=64Mi catalog/52-jsonnet-app/apps/checkout/deployment.jsonnet
  result: 'Passed: exactly one Deployment named jsonnet-app in cat-52; podinfo image
    6.7.1, one replica, memory request 16Mi and memory limit 64Mi.'
  tools:
  - go-jsonnet 0.21.0
expected_reason:
  code: generated-source
  message: it's generated by Jsonnet
  ui_message: 'Radar can''t edit this source: it''s generated by Jsonnet.'
