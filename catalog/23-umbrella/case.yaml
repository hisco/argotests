id: 23-umbrella
title: Umbrella chart
pattern: A parent chart configures a vendored application subchart under its dependency name.
dimensions:
- source-type
- memory-location
sources:
- https://helm.sh/docs/chart_template_guide/subcharts_and_globals/
prevalence:
