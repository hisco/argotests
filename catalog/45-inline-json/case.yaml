id: 45-inline-json
title: Inline JSON6902 patch
pattern: A JSON6902 operation is embedded in kustomization.yaml.
dimensions:
- source-type
- memory-location
- environment-differences
- repo-layout
sources:
- https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/
- https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
prevalence:
  level: occasional
  evidence: This is a documented upstream feature with worked examples. No adoption percentage is claimed.
memory_set_by: 'catalog/45-inline-json/apps/checkout/envs/prod/kustomization.yaml: patches[0].patch JSON6902 operation
  value'
support: full
support_why: The JSON6902 operation is inline in kustomization.yaml. Radar edits the value inside the operation,
  keeps the block as written, and checks the render.
expected: supported
notes:
- 'The locator searches inline text for a memory: line. This inline JSON operation has path: and value: lines instead.
  The base scalar is overridden, so its sentinel does not move the render.'
render_check:
  command: kustomize build catalog/45-inline-json/apps/checkout/envs/prod
  result: 'Passed: exactly one Deployment named inline-json in cat-45; podinfo image 6.7.1, one replica, memory
    request 16Mi and memory limit 64Mi.'
  tools:
  - kustomize 5.6.0
expected_edit:
  file: catalog/45-inline-json/apps/checkout/envs/prod/kustomization.yaml
  key: patches[0].patch -> operation value for the memory limit
