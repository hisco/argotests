id: 01-mono-envs
title: Apps and environments in one repository
pattern: A monorepo keeps reusable applications in apps and environment entry points in envs.
dimensions:
- repo-layout
- environment
sources:
- https://fluxcd.io/flux/guides/repository-structure/
- https://octopus.com/blog/how-to-model-your-gitops-environments
prevalence:
  level: common
  evidence: Flux documents monorepos; the environment-modelling guide publishes an envs example. These
    labels are qualitative, not measured adoption shares.
memory_set_by:
  method: literal manifest scalar
  file: catalog/01-mono-envs/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
  value: 64Mi
expected: supported
notes:
- Predicted for a live synced Deployment, a connected GitHub account with write access, readable repository,
  and no external controller changing memory. The requested edit is 64Mi to 128Mi.
render_check:
  command: kustomize build catalog/01-mono-envs/envs/prod
  result: passed
  assertions:
  - Exactly one Deployment mono-envs in cat-01
  - replicas=1
  - image=ghcr.io/stefanprodan/podinfo:6.7.1
  - requests.memory=16Mi
  - limits.memory=64Mi
  scope: Local workload rendering and YAML parsing. No remote ref or live Argo CD sync was verified.
expected_edit:
  file: catalog/01-mono-envs/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
