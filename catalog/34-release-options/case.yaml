id: 34-release-options
title: Release and namespace options
pattern: An Application overrides the release name and Helm namespace and skips chart CRDs.
dimensions:
- render-options
sources:
- https://argo-cd.readthedocs.io/en/stable/user-guide/helm/
prevalence:
  level: occasional
  evidence: These are explicit options in the Argo CD Helm integration.
  caveat: Qualitative classification. Documentation and public examples are evidence, not a measured adoption
    rate.
memory_set_by: catalog/34-release-options/apps/checkout/values.yaml at resources.limits.memory
support: full
support_why: "Radar's render follows skipCrds the way Argo CD does, so it opens the PR. The edit was checked with Argo CD's own render."
expected: supported
expected_edit:
  file: catalog/34-release-options/apps/checkout/values.yaml
  key: resources.limits.memory
expected_reason: null
notes:
- Prediction assumes Radar can read the repository, has a connected Git identity, knows the Argo CD version,
  and matches the live render. No live cluster was changed.
- Radar reads releaseName and namespace. It still includes CRDs in its preview. With a CRD absent from
  the cluster, service parity can report weaker-render. The service still permits sending that reviewed
  plan.
render_check:
  command: helm template checkout-production catalog/34-release-options/apps/checkout --namespace cat-34
    --skip-crds
  tool: Helm 4.3.0
  result: passed
  deployment: release-options
  namespace: cat-34
  memory_request: 16Mi
  memory_limit: 64Mi
