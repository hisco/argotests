id: 07-dir-filters
title: Directory include and exclude
pattern: Directory globs select deployable manifests and omit operational configuration.
dimensions:
- source-type
- render-overrides
sources:
- https://argo-cd.readthedocs.io/en/stable/user-guide/directory/
prevalence:
  level: occasional
  evidence: The directory guide gives include and exclude examples for non-manifest configuration. These
    labels are qualitative, not measured adoption shares.
memory_set_by:
  method: literal manifest scalar
  file: catalog/07-dir-filters/envs/prod/manifests/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
  value: 64Mi
support: full
support_why: "Applies include and exclude the way Argo CD does and edits the deployed file."
expected: supported
notes:
- Predicted for a live synced Deployment, a connected GitHub account with write access, readable repository,
  and no external controller changing memory. The requested edit is 64Mi to 128Mi.
render_check:
  command: cat catalog/07-dir-filters/envs/prod/manifests/deployment.yaml
  result: passed
  assertions:
  - Exactly one Deployment dir-filters in cat-07
  - replicas=1
  - image=ghcr.io/stefanprodan/podinfo:6.7.1
  - requests.memory=16Mi
  - limits.memory=64Mi
  scope: Local workload rendering and YAML parsing. No remote ref or live Argo CD sync was verified.
expected_edit:
  file: catalog/07-dir-filters/envs/prod/manifests/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
