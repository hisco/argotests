id: 08-yaml-anchor
title: Shared YAML scalar anchor
pattern: A manifest reuses a memory budget through an anchor and an alias.
dimensions:
- memory-location
sources:
- https://helm.sh/docs/v3/chart_template_guide/yaml_techniques/
- https://yaml.org/spec/1.2.2/#3222-anchors-and-aliases
prevalence:
  level: occasional
  evidence: Helm documents anchors and their round-trip pitfalls; no usage survey was found. These labels
    are qualitative, not measured adoption shares.
memory_set_by:
  method: anchored manifest scalar
  file: catalog/08-yaml-anchor/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
  value: 64Mi
support: none
support_why: "The limit is a YAML anchor that other places reuse. Changing it would change them too, so Radar refuses."
expected: not-supported
notes:
- Predicted for a live synced Deployment, a connected GitHub account with write access, readable repository,
  and no external controller changing memory. The requested edit is 64Mi to 128Mi.
- The refusal is safe, but the UI describes a multi-line block even though the actual problem is an anchored
  scalar.
render_check:
  command: cat catalog/08-yaml-anchor/apps/checkout/deployment.yaml
  result: passed
  assertions:
  - Exactly one Deployment yaml-anchor in cat-08
  - replicas=1
  - image=ghcr.io/stefanprodan/podinfo:6.7.1
  - requests.memory=16Mi
  - limits.memory=64Mi
  scope: Local workload rendering and YAML parsing. No remote ref or live Argo CD sync was verified.
expected_reason:
  code: editor-refused
  detail: "Radar found it in catalog/08-yaml-anchor/apps/checkout/deployment.yaml but can't change it safely: anchored scalar: editing it also changes every alias"
  message: 'Radar can''t change this from here: it''s in a multi-line block Radar won''t rewrite safely.'
