apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaml-anchor
  namespace: cat-08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yaml-anchor
  template:
    metadata:
      labels:
        app: yaml-anchor
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        ports:
        - name: http
          containerPort: 9898
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: &memory-budget 64Mi
        env:
        - name: MEMORY_BUDGET
          value: *memory-budget
