apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
replacements:
- source:
    kind: ConfigMap
    name: checkout-resources
    fieldPath: data.memory
  targets:
  - select:
      kind: Deployment
      name: generated-memory
    fieldPaths:
    - spec.template.spec.containers.[name=podinfo].resources.limits.memory
configMapGenerator:
- name: checkout-resources
  envs:
  - resources.env
