id: 53-plugin-render
title: Config management plugin
pattern: A repo-server sidecar plugin generates manifests from configuration and templates.
dimensions:
- source-type
- memory-location
sources:
- https://argo-cd.readthedocs.io/en/stable/operator-manual/config-management-plugins/
prevalence:
  level: occasional
  evidence: This is a documented upstream feature with worked examples. No adoption
    percentage is claimed.
memory_set_by: Application spec.source.plugin.env[name=MEMORY_LIMIT].value; render.sh
  substitutes ARGOCD_ENV_MEMORY_LIMIT in deployment.yaml.in.
support: none
support_why: "A config management plugin builds the manifests. Radar can't run it."
expected: not-supported
notes:
- 'Prerequisite: an Argo CD administrator must install the named CMP sidecar and load
  operator/plugin.yaml as its plugin configuration. This is a plugin configuration
  file, not a Kubernetes custom resource. The local render proves its generate command
  only; no sidecar was installed.'
render_check:
  command: (cd catalog/53-plugin-render/apps/checkout && ARGOCD_ENV_MEMORY_LIMIT=64Mi
    sh render.sh)
  result: 'Passed: exactly one Deployment named plugin-render in cat-53; podinfo image
    6.7.1, one replica, memory request 16Mi and memory limit 64Mi.'
  tools:
  - POSIX sh
  - sed
expected_reason:
  code: generated-source
  message: it's generated by a config management plugin
  ui_message: 'Radar can''t edit this source: it''s generated by a config management
    plugin.'
