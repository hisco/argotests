apiVersion: v1
kind: Service
metadata:
  name: multi-doc
  namespace: cat-09
spec:
  selector:
    app: multi-doc
  ports:
  - port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-doc
  namespace: cat-09
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-doc
  template:
    metadata:
      labels:
        app: multi-doc
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        ports:
        - name: http
          containerPort: 9898
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
