id: 02-app-repo
title: One application repository
pattern: Each application repository carries its own deploy directory.
dimensions:
- repo-layout
sources:
- https://fluxcd.io/flux/guides/repository-structure/
prevalence:
  level: common
  evidence: Flux explicitly describes repo per app as common. These labels are qualitative, not measured
    adoption shares.
memory_set_by:
  method: literal manifest scalar
  file: catalog/02-app-repo/deploy/manifests/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
  value: 64Mi
expected: supported
notes:
- Predicted for a live synced Deployment, a connected GitHub account with write access, readable repository,
  and no external controller changing memory. The requested edit is 64Mi to 128Mi.
- This is the application-repository content, namespaced under catalog for a single checkout. It does
  not claim to test access isolation between repositories.
render_check:
  command: cat catalog/02-app-repo/deploy/manifests/deployment.yaml
  result: passed
  assertions:
  - Exactly one Deployment app-repo in cat-02
  - replicas=1
  - image=ghcr.io/stefanprodan/podinfo:6.7.1
  - requests.memory=16Mi
  - limits.memory=64Mi
  scope: Local workload rendering and YAML parsing. No remote ref or live Argo CD sync was verified.
expected_edit:
  file: catalog/02-app-repo/deploy/manifests/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
