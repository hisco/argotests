apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-repo
  namespace: cat-04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-repo
  template:
    metadata:
      labels:
        app: config-repo
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command:
        - ./podinfo
        ports:
        - name: http
          containerPort: 9898
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
