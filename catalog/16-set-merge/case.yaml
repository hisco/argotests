id: 16-set-merge
title: ApplicationSet environment overrides
pattern: An ApplicationSet merges a baseline list with environment-specific overrides.
dimensions:
- application-creation
- environment
sources:
- https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-Merge/
- https://github.com/argoproj/argocd-example-apps
prevalence:
  level: occasional
  evidence: Official Merge generator and example app coverage; no adoption count was found. These labels
    are qualitative, not measured adoption shares.
memory_set_by:
  method: literal manifest scalar
  file: catalog/16-set-merge/envs/prod/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
  value: 64Mi
support: partial
support_why: "Works from the live generated Application. Radar can't expand a merge generator from Git alone."
expected: supported
notes:
- Predicted for a live synced Deployment, a connected GitHub account with write access, readable repository,
  and no external controller changing memory. The requested edit is 64Mi to 128Mi.
- Support assumes Radar reads the live generated Application and complete ApplicationSet membership. Radar
  does not expand merge generators offline; without complete live membership this set is an opaque possible
  reader.
- generated-application.yaml is derived sample output for inspection, not another Application to install.
  The render check validates its workload source; no ApplicationSet controller was run.
render_check:
  command: cat catalog/16-set-merge/envs/prod/apps/checkout/deployment.yaml
  result: passed
  assertions:
  - Exactly one Deployment set-merge in cat-16
  - replicas=1
  - image=ghcr.io/stefanprodan/podinfo:6.7.1
  - requests.memory=16Mi
  - limits.memory=64Mi
  scope: Local workload rendering and YAML parsing. No remote ref or live Argo CD sync was verified.
expected_edit:
  file: catalog/16-set-merge/envs/prod/apps/checkout/deployment.yaml
  key: spec.template.spec.containers[name=podinfo].resources.limits.memory
