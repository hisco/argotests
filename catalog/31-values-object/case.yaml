id: 31-values-object
title: Inline valuesObject
pattern: An Application supplies the memory limit in its helm.valuesObject map.
dimensions:
- memory-location
sources:
- https://argo-cd.readthedocs.io/en/stable/user-guide/helm/
prevalence:
  level: common
  evidence: valuesObject is the structured inline form documented by Argo CD.
  caveat: Qualitative classification. Documentation and public examples are evidence, not a measured adoption
    rate.
memory_set_by: catalog/argocd/31-values-object.yaml in spec.source.helm
support: none
support_why: "The limit is set in the Application's `helm.valuesObject`. Change it in the Application."
expected: not-supported
expected_edit: null
expected_reason:
  code: app-spec-values
  message: 'Radar can''t change this from here: the value is in the Application''s own spec, which Radar
    doesn''t change yet.'
  detail: the Application sets resources.limits.memory in its own Helm values
notes:
- Prediction assumes Radar can read the repository, has a connected Git identity, knows the Argo CD version,
  and matches the live render. No live cluster was changed.
- The render command uses an equivalent --set value for the one inline memory override. The Application
  remains the source of truth.
render_check:
  command: helm template values-object catalog/31-values-object/apps/checkout --namespace cat-31 --set
    resources.limits.memory=64Mi
  tool: Helm 4.3.0
  result: passed
  deployment: values-object
  namespace: cat-31
  memory_request: 16Mi
  memory_limit: 64Mi
