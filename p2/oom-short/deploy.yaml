# P2 fixture: podinfo holding 100 MB, OOMKilled at 64Mi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-short-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: oom-short-web}
  template:
    metadata:
      labels: {app: oom-short-web}
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command: ["./podinfo", "--stress-memory=100"]
          resources:
            requests: {memory: 16Mi}
            limits: {memory: 320Mi}
