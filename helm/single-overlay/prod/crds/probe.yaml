# Argo passes --include-crds by default; kustomize omits CRDs unless told to.
# If a conversion drops includeCRDs, this object disappears.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: probes.argotests.example
spec:
  group: argotests.example
  names: {kind: Probe, listKind: ProbeList, plural: probes, singular: probe}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema: {type: object}
