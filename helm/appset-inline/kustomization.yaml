apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
#
# Renders the same chart this application rendered through Helm, so its
# objects can be patched here. Every field below mirrors what Argo passed
# to Helm; changing one changes what is deployed.
#
helmGlobals:
  chartHome: .
helmCharts:
  - name: prod
    releaseName: inline
    namespace: probe-inline-appset
    includeCRDs: true
    valuesFile: values.yaml
    additionalValuesFiles:
      - prod/values.yaml
patches:
  - path: configmap-patch.yaml
