apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: worker-e2e
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: platform/deployment-repo/worker/chart
    helm:
      releaseName: worker
      valueFiles:
        - values.yaml
        - values-kind-e2e.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: e2e
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
