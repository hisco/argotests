apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-addons
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-admin
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: platform/argocd/addons
    directory:
      recurse: false
      include: addons-project.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
