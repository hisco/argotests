apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    # before the ApplicationSets that use it
    argocd.argoproj.io/sync-wave: "-1"
  name: addons
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: AppProject for addons
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
