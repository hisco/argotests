apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kind-e2e-2-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  description: AppProject for the kind-e2e-2 cluster
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
