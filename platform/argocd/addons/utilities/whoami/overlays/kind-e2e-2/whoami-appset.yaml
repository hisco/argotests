# Deploys the whoami addon to kind-e2e-2. Present = enabled.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: whoami-kind-e2e-2
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/hisco/argotests.git
        revision: main
        files:
          - path: platform/argocd/cluster-config/kind-e2e-2/config.json
  template:
    metadata:
      name: "addon-{{ .cluster.name }}-whoami"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .argoProject }}"
      source:
        repoURL: https://github.com/hisco/argotests.git
        targetRevision: "{{ .targetRevision }}"
        path: platform/argocd/addons/utilities/whoami/overlays/kind-e2e-2
      destination:
        server: "{{ .cluster.address }}"
        namespace: "addons-{{ .cluster.name }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
