# A worker that holds about 40 MB while it starts, then idles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "head -c 40m /dev/zero | tail > /dev/null; echo ready; sleep 86400"]
          resources:
            requests:
              memory: 8Mi
            limits:
              memory: 32Mi
