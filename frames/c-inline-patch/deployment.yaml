apiVersion: apps/v1
kind: Deployment
metadata:
  name: frames-c
  labels:
    app: frames-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frames-c
  template:
    metadata:
      labels:
        app: frames-c
    spec:
      containers:
        - name: worker
          image: stefanprodan/podinfo:6.7.1
          command: [./podinfo]
          args: [--stress-memory=200]
          resources:
            requests:
              memory: 16Mi
