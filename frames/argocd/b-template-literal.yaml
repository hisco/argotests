apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frames-b
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: frames/b-template-literal/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: frames-b
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
