apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frames-c
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hisco/argotests.git
    targetRevision: main
    path: frames/c-inline-patch
  destination:
    server: https://kubernetes.default.svc
    namespace: frames-c
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
