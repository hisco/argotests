apiVersion: apps/v1
kind: Deployment
metadata:
  name: frames-a
  labels:
    app: frames-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frames-a
  template:
    metadata:
      labels:
        app: frames-a
    spec:
      containers:
        - name: worker
          image: stefanprodan/podinfo:6.7.1
          command: [./podinfo]
          args: [--stress-memory=200]
          resources:
{{ toYaml .Values.resources | indent 12 }}
